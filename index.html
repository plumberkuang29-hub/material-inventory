<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="物料管理">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=管&background=3B82F6&color=fff&size=256">
  
  <title>物料與工具管理 APP</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f3f4f6;
      overflow: hidden;
      /* 確保在行動裝置上佔滿全螢幕並正確適配 Safari */
      height: 100vh;
      height: 100dvh;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Safari 專屬安全距離設定 */
    .safe-top {
      padding-top: max(env(safe-area-inset-top), 16px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, size = 24, className = "" }) => {
      const iconMeta = lucide.icons[name];
      if (!iconMeta) return null;
      
      const svgHtml = iconMeta.toSvg({ 
        width: size, 
        height: size, 
        class: className 
      });

      return <span className={`inline-flex items-center justify-center ${className}`} dangerouslySetInnerHTML={{ __html: svgHtml }} />;
    };

    const Dashboard = ({ setShowSettings, inventory, lowStockItems, borrowedToolsList, setActiveTab, history }) => (
      <div className="h-full overflow-y-auto p-4 space-y-4 pb-28 text-base">
        <div className="bg-green-50 border border-green-200 p-4 rounded-2xl flex items-center justify-between shadow-sm">
          <div className="flex items-center gap-2">
            <span className="relative flex h-3 w-3">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span className="text-base font-bold text-green-800">Google Sheets 自動同步中</span>
          </div>
          <button onClick={() => setShowSettings(true)} className="text-sm bg-green-100 hover:bg-green-200 text-green-700 px-3 py-1.5 rounded-lg font-bold transition">
            設定
          </button>
        </div>

        <div className="grid grid-cols-2 gap-4">
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
            <Icon name="package" className="text-blue-500 mb-2" size={36} />
            <div className="text-4xl font-black text-gray-800">{inventory.length}</div>
            <div className="text-base text-gray-500 mt-1">物料品項</div>
          </div>
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center relative">
            {lowStockItems.length > 0 && (
              <span className="absolute top-3 right-3 flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
              </span>
            )}
            <Icon name="alert-triangle" className={`${lowStockItems.length > 0 ? 'text-red-500' : 'text-green-500'} mb-2`} size={36} />
            <div className="text-4xl font-black text-gray-800">{lowStockItems.length}</div>
            <div className="text-base text-gray-500 mt-1">庫存不足</div>
          </div>
        </div>

        <div className="bg-indigo-50 p-5 rounded-2xl shadow-sm border border-indigo-100 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="bg-indigo-100 p-3 rounded-full">
              <Icon name="wrench" className="text-indigo-600" size={28} />
            </div>
            <div>
              <div className="text-base text-indigo-600 font-bold">目前外借工具</div>
              <div className="text-3xl font-black text-indigo-900">{borrowedToolsList.length} <span className="text-base font-normal">件</span></div>
            </div>
          </div>
          <button onClick={() => setActiveTab('tools')} className="px-5 py-2.5 bg-indigo-600 text-white rounded-full text-base font-bold shadow-sm active:scale-95 transition">查看</button>
        </div>

        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
          <div className="flex justify-between items-center mb-4">
            <h2 className="font-bold text-gray-800 text-lg">最近進出動態</h2>
            <button onClick={() => setActiveTab('history')} className="text-blue-600 text-base font-bold">查看全部</button>
          </div>
          <div className="space-y-3">
            {history.slice(0, 3).map(record => (
              <div key={record.id} className="flex items-center justify-between p-3.5 bg-gray-50 rounded-xl">
                <div className="flex items-center gap-3">
                  <div className={`p-2.5 rounded-full ${record.type === 'in' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                    <Icon name={record.type === 'in' ? 'arrow-down-to-line' : 'arrow-up-from-line'} size={22} />
                  </div>
                  <div>
                    <div className="font-bold text-gray-800 text-base">{record.itemName}</div>
                    <div className="text-sm text-gray-500">{record.date.split(' ')[1]}</div>
                  </div>
                </div>
                <div className={`font-black text-xl ${record.type === 'in' ? 'text-green-600' : 'text-orange-600'}`}>
                  {record.type === 'in' ? '+' : '-'}{record.amount}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    const Inventory = ({ searchQuery, setSearchQuery, filteredInventory, setActionData, setShowActionModal, setShowAddMaterialModal, handleDeleteMaterial }) => (
      <div className="flex flex-col h-full relative">
        <div className="p-4 bg-white shadow-sm z-10 shrink-0">
          <div className="relative">
            <Icon name="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" size={22} />
            <input 
              type="text" 
              placeholder="搜尋品項名稱、規格或編號..." 
              className="w-full pl-11 pr-4 py-3.5 bg-gray-100 border-transparent rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base font-medium transition"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-4 space-y-3.5 pb-28">
          {filteredInventory.map(item => (
            <div key={item.id} className="bg-white p-4.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3.5">
              <div className="flex justify-between items-start">
                <div>
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="text-sm text-gray-400 font-bold">{item.id}</span>
                    {item.spec && <span className="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md font-bold">{item.spec}</span>}
                  </div>
                  <div className="font-black text-gray-800 text-xl">{item.name}</div>
                </div>
                <div className="flex items-start gap-3">
                  <div className="text-right">
                    <div className={`text-3xl font-black ${item.quantity <= item.minStock ? 'text-red-500' : 'text-gray-800'}`}>
                      {item.quantity} <span className="text-base font-normal text-gray-500">{item.unit}</span>
                    </div>
                    {item.quantity <= item.minStock && <div className="text-xs text-red-500 font-bold mt-0.5">庫存不足</div>}
                  </div>
                  <button 
                    onClick={() => handleDeleteMaterial(item.id, item.name)}
                    className="text-gray-300 hover:text-red-500 p-1.5 transition"
                    title="刪除物料"
                  >
                    <Icon name="trash-2" size={20} />
                  </button>
                </div>
              </div>
              <div className="flex gap-2.5 pt-3 border-t border-gray-50">
                <button 
                  onClick={() => { setActionData({item, type: 'in'}); setShowActionModal(true); }}
                  className="flex-1 bg-green-50 text-green-700 py-3 rounded-xl font-bold text-base flex items-center justify-center gap-2 active:bg-green-100 transition"
                >
                  <Icon name="arrow-down-to-line" size={20} /> 進貨
                </button>
                <button 
                  onClick={() => { setActionData({item, type: 'out'}); setShowActionModal(true); }}
                  className="flex-1 bg-orange-50 text-orange-700 py-3 rounded-xl font-bold text-base flex items-center justify-center gap-2 active:bg-orange-100 transition"
                >
                  <Icon name="arrow-up-from-line" size={20} /> 出貨
                </button>
              </div>
            </div>
          ))}
        </div>
        <button 
          className="absolute bottom-24 right-6 bg-blue-600 text-white p-4.5 rounded-full shadow-lg active:scale-90 transition shadow-blue-500/40 z-20"
          onClick={() => setShowAddMaterialModal(true)}
        >
          <Icon name="plus" size={32} />
        </button>
      </div>
    );

    const Tools = ({ tools, borrowedToolsList, setBorrowData, setShowBorrowModal, handleReturnTool, setShowAddToolModal, handleDeleteTool }) => {
      const [toolTab, setToolTab] = useState('list');
      
      return (
        <div className="flex flex-col h-full relative">
          <div className="bg-white p-2.5 flex justify-center border-b border-gray-100 shrink-0 z-10">
            <div className="flex bg-gray-100 p-1 rounded-xl w-full max-w-sm">
              <button 
                onClick={() => setToolTab('list')}
                className={`flex-1 py-2.5 text-base font-bold rounded-lg transition ${toolTab === 'list' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500'}`}
              >可借用清單</button>
              <button 
                onClick={() => setToolTab('borrowed')}
                className={`flex-1 py-2.5 text-base font-bold rounded-lg transition ${toolTab === 'borrowed' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500'}`}
              >
                外借紀錄 
                {borrowedToolsList.length > 0 && <span className="ml-1.5 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{borrowedToolsList.length}</span>}
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-3.5 pb-28">
            {toolTab === 'list' ? (
              <>
                {tools.map(tool => {
                  const availableItems = tool.items.filter(i => i.status === 'available');
                  return (
                    <div key={tool.id} className="bg-white p-4.5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                      <div>
                        <div className="text-sm text-gray-400 font-bold mb-1">{tool.id}</div>
                        <div className="font-black text-gray-800 text-xl">{tool.name}</div>
                        <div className="text-base text-gray-500 mt-1.5">
                          可借用: <span className="font-black text-indigo-600 text-lg">{availableItems.length}</span> / {tool.items.length} {tool.unit}
                        </div>
                      </div>
                      <div className="flex items-center gap-2.5">
                        <button 
                          onClick={() => { setBorrowData({tool}); setShowBorrowModal(true); }}
                          disabled={availableItems.length === 0}
                          className={`px-4 py-3 rounded-xl font-bold text-base flex items-center gap-2 transition ${
                            availableItems.length === 0 
                            ? 'bg-gray-100 text-gray-400 cursor-not-allowed' 
                            : 'bg-indigo-50 text-indigo-700 active:bg-indigo-100'
                          }`}
                        >
                          <Icon name="hand" size={20} /> 
                          {availableItems.length === 0 ? '已全借出' : '登記借用'}
                        </button>
                        <button 
                          onClick={() => handleDeleteTool(tool.id, tool.name)}
                          className="text-gray-300 hover:text-red-500 p-1.5 transition"
                          title="刪除工具"
                        >
                          <Icon name="trash-2" size={20} />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </>
            ) : (
              <>
                {borrowedToolsList.length === 0 ? (
                  <div className="text-center text-gray-400 py-12 text-base">目前沒有外借中的工具</div>
                ) : (
                  borrowedToolsList.map((record, idx) => (
                    <div key={idx} className="bg-white p-4.5 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-indigo-500 flex flex-col gap-2.5">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="font-black text-gray-800 text-xl flex items-center gap-2">
                            {record.toolName} 
                            <span className="text-xs font-bold bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full">{record.itemNo}</span>
                          </div>
                          <div className="text-base text-gray-600 mt-2 flex items-center gap-1.5">
                            <Icon name="user" size={16} /> 借用人: <span className="font-bold">{record.borrower}</span>
                          </div>
                          <div className="text-base text-gray-600 mt-1 flex items-center gap-1.5">
                            <Icon name="map-pin" size={16} /> 位置: <span className="font-bold">{record.location}</span>
                          </div>
                        </div>
                        <button 
                          onClick={() => handleReturnTool(record.toolId, record.itemNo)}
                          className="px-4 py-2.5 bg-gray-800 text-white rounded-xl text-base font-bold shadow-sm active:bg-gray-700 transition"
                        >
                          確認歸還
                        </button>
                      </div>
                      <div className="text-xs text-gray-400 mt-1 flex items-center gap-1.5 border-t border-gray-50 pt-2.5">
                        <Icon name="clock" size={14} /> 借出時間: {record.borrowDate}
                      </div>
                    </div>
                  ))
                )}
              </>
            )}
          </div>
          {toolTab === 'list' && (
            <button 
              className="absolute bottom-24 right-6 bg-indigo-600 text-white p-4.5 rounded-full shadow-lg active:scale-90 transition shadow-indigo-500/40 z-20"
              onClick={() => setShowAddToolModal(true)}
            >
              <Icon name="plus" size={32} />
            </button>
          )}
        </div>
      );
    }

    const History = ({ history }) => (
      <div className="h-full overflow-y-auto p-4 space-y-3.5 pb-28 text-base">
        {history.map(record => (
          <div key={record.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div className="flex justify-between items-center mb-2.5">
               <div className="flex items-center gap-2 w-full">
                 <span className={`text-xs font-bold px-2.5 py-1 rounded-lg shrink-0 ${record.type === 'in' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                    {record.type === 'in' ? '進貨入庫' : '出貨領用'}
                 </span>
                 <span className="text-sm text-gray-500 truncate">{record.note}</span>
               </div>
            </div>
            
            <div className="flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                <div className="font-bold text-gray-800 text-lg flex-1 truncate">
                  {record.itemName}
                </div>
                
                <div className="mx-2 bg-gray-200/50 text-gray-600 text-xs font-bold px-2.5 py-1.5 rounded-md shadow-sm border border-gray-200 shrink-0 flex flex-col items-center justify-center">
                    <span className="text-[10px] uppercase opacity-70 mb-0.5">{record.date.split(' ')[0]}</span>
                    <span className="text-sm">{record.date.split(' ')[1]}</span>
                </div>

                <div className={`font-black text-2xl shrink-0 ${record.type === 'in' ? 'text-green-600' : 'text-orange-600'}`}>
                  {record.type === 'in' ? '+' : '-'}{record.amount}
                </div>
            </div>
          </div>
        ))}
        {history.length === 0 && <div className="text-center text-gray-400 py-12 text-base">尚無紀錄</div>}
      </div>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');

      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('app_inventory');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return [
          { id: 'M001', name: '水泥 (50kg)', spec: '50kg', quantity: 15, unit: '包', minStock: 5 },
          { id: 'M002', name: '紅磚', spec: '標準型', quantity: 350, unit: '塊', minStock: 100 },
          { id: 'M003', name: '矽利康', spec: '透明', quantity: 3, unit: '支', minStock: 10 },
        ];
      });

      const [tools, setTools] = useState(() => {
        const saved = localStorage.getItem('app_tools');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return [
          { id: 'T001', name: '手推車', unit: '台', items: [
            { itemNo: '1號', status: 'available' },
            { itemNo: '2號', status: 'borrowed', borrower: '王大明', location: 'A棟3樓', borrowDate: '2026-08-25 09:30' }
          ]},
          { id: 'T002', name: '電動電鑽', unit: '把', items: [
            { itemNo: '1號', status: 'available' },
            { itemNo: '2號', status: 'available' },
            { itemNo: '3號', status: 'available' }
          ]}
        ];
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('app_history');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return [
          { id: 1, type: 'in', itemName: '水泥 (50kg)', amount: 10, date: '2026-08-27 08:30', note: '進貨補充' },
          { id: 2, type: 'out', itemName: '矽利康', amount: 2, date: '2026-08-26 14:15', note: 'B棟浴室修繕' },
        ];
      });

      useEffect(() => {
        localStorage.setItem('app_inventory', JSON.stringify(inventory));
      }, [inventory]);

      useEffect(() => {
        localStorage.setItem('app_tools', JSON.stringify(tools));
      }, [tools]);

      useEffect(() => {
        localStorage.setItem('app_history', JSON.stringify(history));
      }, [history]);

      const [showAddMaterialModal, setShowAddMaterialModal] = useState(false);
      const [newMatName, setNewMatName] = useState('');
      const [newMatSpec, setNewMatSpec] = useState('');
      const [newMatQty, setNewMatQty] = useState('');
      const [newMatUnit, setNewMatUnit] = useState('支');
      const [newMatMin, setNewMatMin] = useState('5');

      const [showAddToolModal, setShowAddToolModal] = useState(false);
      const [newToolName, setNewToolName] = useState('');
      const [newToolUnit, setNewToolUnit] = useState('台');
      const [newToolCount, setNewToolCount] = useState('3');

      const [showActionModal, setShowActionModal] = useState(false);
      const [actionData, setActionData] = useState(null);
      const [actionAmount, setActionAmount] = useState('');
      const [actionNote, setActionNote] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [showBorrowModal, setShowBorrowModal] = useState(false);
      const [borrowData, setBorrowData] = useState(null);
      const [selectedItemNo, setSelectedItemNo] = useState('');
      const [borrowerName, setBorrowerName] = useState('');
      const [borrowLocation, setBorrowLocation] = useState('');

      const [messageBox, setMessageBox] = useState(null);
      const [showSettings, setShowSettings] = useState(false);

      const showAlert = (message) => setMessageBox({ type: 'alert', message });
      const showConfirm = (message, onConfirm) => setMessageBox({ type: 'confirm', message, onConfirm });

      const googleSheetUrl = 'https://script.google.com/macros/s/AKfycbzSm7Wu_suB92wUna4R3pxS4B-aL93g-ZBju4GS75VcuEJcKKfRhVF0KA--xiG0Kbx7EA/exec';

      const syncToGoogleSheets = (data) => {
        if (!googleSheetUrl) return;
        fetch(googleSheetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        }).catch(err => console.error("Google Sheets 同步失敗:", err));
      };

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "類別,時間,品項/工具,數量/編號,動作,借用人/備註,位置\n";

        history.forEach(record => {
          const action = record.type === 'in' ? '進貨' : '出貨';
          const safeNote = (record.note || '').replace(/"/g, '""');
          const row = ['物料', record.date, `"${record.itemName}"`, record.amount, action, `"${safeNote}"`, ''].join(",");
          csvContent += row + "\n";
        });

        tools.forEach(tool => {
          tool.items.forEach(item => {
            if (item.status === 'borrowed') {
              const safeBorrower = (item.borrower || '').replace(/"/g, '""');
              const safeLocation = (item.location || '').replace(/"/g, '""');
              const row = ['工具', item.borrowDate, `"${tool.name}"`, item.itemNo, '借用中', `"${safeBorrower}"`, `"${safeLocation}"`].join(",");
              csvContent += row + "\n";
            }
          });
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `管理紀錄_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleAddMaterialSubmit = () => {
        if (!newMatName.trim()) return showAlert("請輸入物料名稱");
        const qty = parseInt(newMatQty);
        const min = parseInt(newMatMin);
        if (isNaN(qty) || qty < 0) return showAlert("請輸入有效的初始庫存");

        const newId = 'M' + String(inventory.length + 1).padStart(3, '0');
        const newItem = {
          id: newId,
          name: newMatName.trim(),
          spec: newMatSpec.trim(),
          quantity: qty,
          unit: newMatUnit.trim() || '個',
          minStock: isNaN(min) ? 5 : min
        };

        setInventory(prev => [...prev, newItem]);
        setShowAddMaterialModal(false);
        setNewMatName('');
        setNewMatSpec('');
        setNewMatQty('');
        showAlert(`成功新增物料：${newItem.name} ${newItem.spec}`);
      };

      const handleAddToolSubmit = () => {
        if (!newToolName.trim()) return showAlert("請輸入工具名稱");
        const count = parseInt(newToolCount);
        if (isNaN(count) || count <= 0) return showAlert("請輸入有效的數量");

        const newId = 'T' + String(tools.length + 1).padStart(3, '0');
        let itemsArr = [];
        for (let i = 1; i <= count; i++) {
          itemsArr.push({ itemNo: `${i}號`, status: 'available' });
        }

        const newTool = {
          id: newId,
          name: newToolName.trim(),
          unit: newToolUnit.trim() || '支',
          items: itemsArr
        };

        setTools(prev => [...prev, newTool]);
        setShowAddToolModal(false);
        setNewToolName('');
        setNewToolCount('3');
        showAlert(`成功新增工具類別：${newTool.name} (${count}個)`);
      };

      const handleDeleteMaterial = (id, name) => {
        showConfirm(`確定要刪除物料「${name}」嗎？`, () => {
          setInventory(prev => prev.filter(item => item.id !== id));
          showAlert(`已刪除物料：${name}`);
        });
      };

      const handleDeleteTool = (id, name) => {
        showConfirm(`確定要刪除工具類別「${name}」嗎？`, () => {
          setTools(prev => prev.filter(tool => tool.id !== id));
          showAlert(`已刪除工具：${name}`);
        });
      };

      const handleActionSubmit = () => {
        const amount = parseInt(actionAmount);
        if (!amount || amount <= 0) return showAlert("請輸入有效數量");
        
        if (actionData.type === 'out' && amount > actionData.item.quantity) {
          return showAlert("出貨數量不可大於現有庫存！");
        }

        const newQuantity = actionData.type === 'in' 
          ? actionData.item.quantity + amount 
          : actionData.item.quantity - amount;

        setInventory(prev => prev.map(item => 
          item.id === actionData.item.id ? { ...item, quantity: newQuantity } : item
        ));

        const timeString = new Date().toLocaleString('zh-TW', { hour12: false }).substring(0, 16);
        const note = actionNote || (actionData.type === 'in' ? '一般進貨' : '一般出貨');

        setHistory(prev => [{
          id: Date.now() + Math.random().toString(36).substring(2, 9),
          type: actionData.type,
          itemName: `${actionData.item.name} ${actionData.item.spec ? '(' + actionData.item.spec + ')' : ''}`,
          amount: amount,
          date: timeString,
          note: note
        }, ...prev]);

        syncToGoogleSheets({
          type: '物料',
          time: timeString,
          name: `${actionData.item.name} [${actionData.item.spec || '無規格'}]`,
          amount_no: amount.toString(),
          action: actionData.type === 'in' ? '進貨' : '出貨',
          user_note: note,
          location: ''
        });

        setShowActionModal(false);
        setActionAmount('');
        setActionNote('');
      };

      const handleBorrowSubmit = () => {
        if (!selectedItemNo) return showAlert("請選擇工具編號");
        if (!borrowerName.trim()) return showAlert("請輸入借用人姓名");
        if (!borrowLocation.trim()) return showAlert("請輸入施作位置");

        const timeString = new Date().toLocaleString('zh-TW', { hour12: false }).substring(0, 16);

        setTools(prev => prev.map(tool => {
          if (tool.id === borrowData.tool.id) {
            return {
              ...tool,
              items: tool.items.map(item => {
                if (item.itemNo === selectedItemNo) {
                  return {
                    ...item,
                    status: 'borrowed',
                    borrower: borrowerName,
                    location: borrowLocation,
                    borrowDate: timeString
                  };
                }
                return item;
              })
            };
          }
          return tool;
        }));

        syncToGoogleSheets({
          type: '工具',
          time: timeString,
          name: borrowData.tool.name,
          amount_no: selectedItemNo,
          action: '借出',
          user_note: borrowerName,
          location: borrowLocation
        });

        setShowBorrowModal(false);
        setSelectedItemNo('');
        setBorrowerName('');
        setBorrowLocation('');
      };

      const handleReturnTool = (toolId, itemNo) => {
        showConfirm(`確認要歸還 ${itemNo} 嗎？`, () => {
          setTools(prev => prev.map(tool => {
            if (tool.id === toolId) {
              return {
                ...tool,
                items: tool.items.map(item => 
                  item.itemNo === itemNo 
                    ? { itemNo: item.itemNo, status: 'available' } 
                    : item
                )
              };
            }
            return tool;
          }));

          const toolName = tools.find(t => t.id === toolId)?.name || '未知工具';
          syncToGoogleSheets({
            type: '工具',
            time: new Date().toLocaleString('zh-TW', { hour12: false }).substring(0, 16),
            name: toolName,
            amount_no: itemNo,
            action: '歸還',
            user_note: '',
            location: ''
          });
        });
      };

      const lowStockItems = useMemo(() => inventory.filter(i => i.quantity <= i.minStock), [inventory]);
      const borrowedToolsList = useMemo(() => {
        let list = [];
        tools.forEach(tool => {
          tool.items.forEach(item => {
            if (item.status === 'borrowed') {
              list.push({ toolName: tool.name, toolId: tool.id, ...item });
            }
          });
        });
        return list;
      }, [tools]);

      const filteredInventory = useMemo(() => {
        return inventory.filter(item => 
          item.name.includes(searchQuery) || 
          (item.spec && item.spec.includes(searchQuery)) || 
          item.id.includes(searchQuery)
        );
      }, [inventory, searchQuery]);

      return (
        <div className="h-full w-full flex flex-col bg-gray-100 max-w-md mx-auto overflow-hidden relative">
          
          {/* 上方固定標題列 (加入 safe-top 避開瀏海) */}
          <header className="bg-blue-600 text-white safe-top pb-3 px-4 shadow-md z-20 flex justify-between items-end h-20 shrink-0 relative">
            <h1 className="text-xl font-black tracking-wider w-full text-center relative">
              {activeTab === 'dashboard' && '管理儀表板'}
              {activeTab === 'inventory' && '庫存管理'}
              {activeTab === 'tools' && '工具借用'}
              {activeTab === 'history' && '歷史紀錄'}
            </h1>
            
            {activeTab === 'history' && (
              <button 
                onClick={exportToCSV}
                className="absolute right-4 bottom-2.5 flex items-center justify-center bg-blue-700 hover:bg-blue-800 px-3.5 py-2 rounded-xl text-sm font-bold transition active:scale-95 shadow-sm border border-blue-500"
              >
                <Icon name="download" size={18} className="mr-1" />
                匯出
              </button>
            )}

            <button 
              onClick={() => setShowSettings(true)}
              className="absolute left-4 bottom-2.5 flex items-center justify-center bg-blue-700 hover:bg-blue-800 p-2 rounded-xl text-sm transition active:scale-95"
            >
              <Icon name="settings" size={22} />
            </button>
          </header>

          {/* 中間可獨立捲動的主內容區 */}
          <main className="flex-1 overflow-hidden relative z-0">
            {activeTab === 'dashboard' && (
              <Dashboard 
                setShowSettings={setShowSettings}
                inventory={inventory}
                lowStockItems={lowStockItems}
                borrowedToolsList={borrowedToolsList}
                setActiveTab={setActiveTab}
                history={history}
              />
            )}
            {activeTab === 'inventory' && (
              <Inventory 
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                filteredInventory={filteredInventory}
                setActionData={setActionData}
                setShowActionModal={setShowActionModal}
                setShowAddMaterialModal={setShowAddMaterialModal}
                handleDeleteMaterial={handleDeleteMaterial}
              />
            )}
            {activeTab === 'tools' && (
              <Tools 
                tools={tools}
                borrowedToolsList={borrowedToolsList}
                setBorrowData={setBorrowData}
                setShowBorrowModal={setShowBorrowModal}
                handleReturnTool={handleReturnTool}
                setShowAddToolModal={setShowAddToolModal}
                handleDeleteTool={handleDeleteTool}
              />
            )}
            {activeTab === 'history' && <History history={history} />}
          </main>

          {/* 下方固定導覽列 (加入 safe-bottom 避開底部橫條) */}
          <nav className="bg-white border-t border-gray-200 flex justify-around items-center h-20 shrink-0 w-full safe-bottom z-20 shadow-[0_-5px_15px_-5px_rgba(0,0,0,0.1)]">
            {[
              { id: 'dashboard', icon: 'layout-dashboard', label: '首頁' },
              { id: 'inventory', icon: 'package-search', label: '庫存' },
              { id: 'tools', icon: 'wrench', label: '工具' },
              { id: 'history', icon: 'clipboard-list', label: '紀錄' }
            ].map(tab => (
              <button 
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${activeTab === tab.id ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <Icon name={tab.icon} size={26} className={activeTab === tab.id ? 'fill-blue-50/50' : ''} />
                <span className="text-xs font-bold">{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* 新增物料 Modal */}
          {showAddMaterialModal && (
            <div className="absolute inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full sm:w-[90%] sm:rounded-3xl rounded-t-3xl p-6 pb-safe shadow-2xl animate-in slide-in-from-bottom-10 duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-blue-100 text-blue-600">
                      <Icon name="package-plus" size={26} />
                    </span>
                    新增物料品項
                  </h3>
                  <button onClick={() => setShowAddMaterialModal(false)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2.5 rounded-full transition">
                    <Icon name="x" size={22} />
                  </button>
                </div>

                <div className="space-y-4 text-base">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">物料名稱 <span className="text-red-500">*</span></label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base transition"
                      placeholder="例如: PVC管、電纜線..."
                      value={newMatName}
                      onChange={(e) => setNewMatName(e.target.value)}
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">規格 / 尺寸 (選填)</label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base transition"
                      placeholder="例如: 2吋、5.5mm²..."
                      value={newMatSpec}
                      onChange={(e) => setNewMatSpec(e.target.value)}
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">初始庫存量</label>
                      <input 
                        type="number" pattern="[0-9]*" inputMode="numeric"
                        className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base font-bold transition"
                        placeholder="0"
                        value={newMatQty}
                        onChange={(e) => setNewMatQty(e.target.value)}
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">單位</label>
                      <input 
                        type="text" 
                        className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base transition"
                        placeholder="支、捲、包..."
                        value={newMatUnit}
                        onChange={(e) => setNewMatUnit(e.target.value)}
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">最低庫存警戒值</label>
                    <input 
                      type="number" pattern="[0-9]*" inputMode="numeric"
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base transition"
                      placeholder="低於此數量會紅字警告"
                      value={newMatMin}
                      onChange={(e) => setNewMatMin(e.target.value)}
                    />
                  </div>
                  <div className="flex gap-3 mt-4">
                    <button 
                      onClick={() => setShowAddMaterialModal(false)}
                      className="flex-1 py-4 rounded-xl font-bold text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 text-base transition"
                    >
                      取消
                    </button>
                    <button 
                      onClick={handleAddMaterialSubmit}
                      className="flex-1 py-4 rounded-xl font-bold text-white text-lg shadow-lg active:scale-95 transition bg-blue-600 shadow-blue-500/30"
                    >
                      確認新增
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 新增工具 Modal */}
          {showAddToolModal && (
            <div className="absolute inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full sm:w-[90%] sm:rounded-3xl rounded-t-3xl p-6 pb-safe shadow-2xl animate-in slide-in-from-bottom-10 duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-indigo-100 text-indigo-600">
                      <Icon name="wrench" size={26} />
                    </span>
                    新增工具類別
                  </h3>
                  <button onClick={() => setShowAddToolModal(false)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2.5 rounded-full transition">
                    <Icon name="x" size={22} />
                  </button>
                </div>

                <div className="space-y-4 text-base">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">工具名稱 <span className="text-red-500">*</span></label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base transition"
                      placeholder="例如: 充電式鎚鑽..."
                      value={newToolName}
                      onChange={(e) => setNewToolName(e.target.value)}
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">總數量 (自動編號)</label>
                      <input 
                        type="number" pattern="[0-9]*" inputMode="numeric"
                        className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base font-bold transition"
                        placeholder="3"
                        value={newToolCount}
                        onChange={(e) => setNewToolCount(e.target.value)}
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">單位</label>
                      <input 
                        type="text" 
                        className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base transition"
                        placeholder="支、台、把..."
                        value={newToolUnit}
                        onChange={(e) => setNewToolUnit(e.target.value)}
                      />
                    </div>
                  </div>
                  <div className="flex gap-3 mt-4">
                    <button 
                      onClick={() => setShowAddToolModal(false)}
                      className="flex-1 py-4 rounded-xl font-bold text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 text-base transition"
                    >
                      取消
                    </button>
                    <button 
                      onClick={handleAddToolSubmit}
                      className="flex-1 py-4 rounded-xl font-bold text-white text-lg shadow-lg active:scale-95 transition bg-indigo-600 shadow-indigo-500/30"
                    >
                      確認新增
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 進出貨表單 Modal */}
          {showActionModal && actionData && (
            <div className="absolute inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full sm:w-[90%] sm:rounded-3xl rounded-t-3xl p-6 pb-safe shadow-2xl animate-in slide-in-from-bottom-10 duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className={`p-2 rounded-xl ${actionData.type === 'in' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                      <Icon name={actionData.type === 'in' ? 'arrow-down-to-line' : 'arrow-up-from-line'} size={26} />
                    </span>
                    {actionData.type === 'in' ? '新增進貨' : '出貨領用'}
                  </h3>
                  <button onClick={() => setShowActionModal(false)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2.5 rounded-full transition">
                    <Icon name="x" size={22} />
                  </button>
                </div>
                
                <div className="bg-gray-50 p-4 rounded-2xl mb-6">
                  <div className="text-sm text-gray-500 mb-1">{actionData.item.id} {actionData.item.spec && `| 規格: ${actionData.item.spec}`}</div>
                  <div className="text-xl font-black text-gray-800">{actionData.item.name}</div>
                  <div className="text-base text-gray-600 mt-2">目前庫存: <span className="font-black text-xl">{actionData.item.quantity}</span> {actionData.item.unit}</div>
                </div>

                <div className="space-y-4 text-base">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">
                      {actionData.type === 'in' ? '進貨數量' : '出貨數量'} <span className="text-red-500">*</span>
                    </label>
                    <div className="relative">
                      <input 
                        type="number" 
                        pattern="[0-9]*" inputMode="numeric"
                        className="w-full pl-4 pr-14 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-xl font-bold transition"
                        placeholder="請輸入數量..."
                        value={actionAmount}
                        onChange={(e) => setActionAmount(e.target.value)}
                      />
                      <div className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-base">
                        {actionData.item.unit}
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">備註事項 (選填)</label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base transition"
                      placeholder="用途、施工位置或經手人..."
                      value={actionNote}
                      onChange={(e) => setActionNote(e.target.value)}
                    />
                  </div>
                  <button 
                    onClick={handleActionSubmit}
                    className={`w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg active:scale-95 transition mt-4 ${
                      actionData.type === 'in' ? 'bg-green-600 shadow-green-500/30' : 'bg-orange-600 shadow-orange-500/30'
                    }`}
                  >
                    確認{actionData.type === 'in' ? '進貨' : '出貨'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 借用工具表單 Modal */}
          {showBorrowModal && borrowData && (
            <div className="absolute inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full sm:w-[90%] sm:rounded-3xl rounded-t-3xl p-6 pb-safe shadow-2xl animate-in slide-in-from-bottom-10 duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-indigo-100 text-indigo-600">
                      <Icon name="hand" size={26} />
                    </span>
                    登記借用
                  </h3>
                  <button onClick={() => setShowBorrowModal(false)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2.5 rounded-full transition">
                    <Icon name="x" size={22} />
                  </button>
                </div>
                
                <div className="bg-indigo-50 p-4 rounded-2xl mb-6">
                  <div className="text-sm text-indigo-500 mb-1 font-bold">{borrowData.tool.id}</div>
                  <div className="text-xl font-black text-indigo-900">{borrowData.tool.name}</div>
                </div>

                <div className="space-y-4 text-base">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">選擇工具編號 <span className="text-red-500">*</span></label>
                    <select 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-lg font-bold transition"
                      value={selectedItemNo}
                      onChange={(e) => setSelectedItemNo(e.target.value)}
                    >
                      <option value="">-- 請選擇要借用的編號 --</option>
                      {borrowData.tool.items.filter(i => i.status === 'available').map(item => (
                        <option key={item.itemNo} value={item.itemNo}>{item.itemNo}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">借用人姓名 <span className="text-red-500">*</span></label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base transition"
                      placeholder="請輸入姓名..."
                      value={borrowerName}
                      onChange={(e) => setBorrowerName(e.target.value)}
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">施作位置 <span className="text-red-500">*</span></label>
                    <input 
                      type="text" 
                      className="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base transition"
                      placeholder="例如: A棟3樓、地下室..."
                      value={borrowLocation}
                      onChange={(e) => setBorrowLocation(e.target.value)}
                    />
                  </div>
                  <button 
                    onClick={handleBorrowSubmit}
                    className="w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg active:scale-95 transition mt-4 bg-indigo-600 shadow-indigo-500/30"
                  >
                    確認登記借用
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 系統設定 Modal */}
          {showSettings && (
            <div className="absolute inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full sm:w-[90%] sm:rounded-3xl rounded-t-3xl p-6 pb-safe shadow-2xl animate-in slide-in-from-bottom-10 duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-blue-100 text-blue-600">
                      <Icon name="link" size={26} />
                    </span>
                    系統連線設定
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2.5 rounded-full transition">
                    <Icon name="x" size={22} />
                  </button>
                </div>
                <div className="space-y-4 text-base">
                  <div className="p-4 bg-green-50 border border-green-200 rounded-xl">
                    <h4 className="font-bold text-green-800 flex items-center gap-2 mb-2">
                      <Icon name="check-circle" size={20} /> Google Sheets 已連線
                    </h4>
                    <p className="text-sm text-green-700 leading-relaxed">此應用程式已內建您的專屬 API 網址，所有的進出與借用紀錄將會自動在背景傳送至您的 Google 試算表。</p>
                  </div>
                  <button 
                    onClick={() => setShowSettings(false)}
                    className="w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg active:scale-95 transition mt-4 bg-blue-600 shadow-blue-500/30"
                  >
                    關閉
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 客製化 Alert / Confirm 對話框 */}
          {messageBox && (
            <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-in fade-in duration-200">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl animate-in zoom-in-95 duration-200">
                <div className="text-center">
                  <div className="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-blue-100 mb-4">
                    <Icon name="info" className="h-7 w-7 text-blue-600" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-900 mb-2">系統提示</h3>
                  <div className="mt-2 px-2">
                    <p className="text-base text-gray-600">{messageBox.message}</p>
                  </div>
                </div>
                <div className={`mt-6 flex gap-3 ${messageBox.type === 'confirm' ? 'justify-between' : 'justify-center'}`}>
                  {messageBox.type === 'confirm' && (
                    <button
                      onClick={() => setMessageBox(null)}
                      className="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-3.5 px-4 rounded-xl hover:bg-red-100 text-base transition-colors"
                    >
                      取消
                    </button>
                  )}
                  <button
                    onClick={() => {
                      if (messageBox.type === 'confirm' && messageBox.onConfirm) {
                        messageBox.onConfirm();
                      }
                      setMessageBox(null);
                    }}
                    className={`w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 hover:bg-blue-700 text-base transition-colors ${messageBox.type === 'alert' ? 'max-w-[200px]' : ''}`}
                  >
                    確定
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
